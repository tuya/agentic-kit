# GitLab CI for agentic-kit.
#
# The job set mirrors .github/workflows/ci.yml so both providers gate the same
# work: build & test, sanitizers (ASan + UBSan) and the POSIX examples build.
# GitLab adds the valgrind leak stage, the pages docs build (GitHub deploys
# docs only from main via deploy-docs.yml), the CodeScan security scan
# (internal platform behind a group token; no GitHub equivalent) and a
# blocking gitleaks secret-detection gate. Conventions
# follow the iot-sdk pipeline (build / test stages, ${BUILD_IMAGE}, manual
# submodule init, build artifacts handed to downstream jobs).
#
# ${BUILD_IMAGE} is a group-level CI/CD variable pointing at the shared Debian
# build image (cmake, gcc, python3, valgrind, git). It must be defined in the
# project/group CI settings, same as iot-sdk.
#
# Not mirrored from GitHub: the ubuntu+macOS build-test matrix (the runners
# here are Linux only) and paths-ignore for docs-only pushes (GitLab
# rules:changes matches on ANY changed file, so it cannot express "skip only
# when ALL changes are docs" without skipping mixed commits too).

# Stage layout mirrors the real DAG (see each job's `needs`): `pre-build`
# holds only secret detection (it gates repo content, not the build); `build`
# is the parallel wave -- build, codescan, test:sanitizers and examples carry
# needs: [] (build by being first) and start together; `test` needs only the
# build job; `memory-leak` needs build+test; `pages` is unattached (needs: [],
# master/main only). Keeping every parallel job in the first stage makes the
# default stage view show the same grouping as the DAG view instead of six
# columns that read as a serial pipeline.
#
# The parallel wave relies on docker-executor isolation: `test` and
# `test:sanitizers` both run the mock-driven suites that bind compile-time
# ports (8443/8198/11885), and their overlap is only safe because each job
# gets its own container network namespace (the `image:` entries below imply
# docker). On a shell-executor runner with concurrent > 1 two jobs would
# fight for those ports -- keep this pipeline off shell runners (see
# CONTRIBUTING.md, "Validation before you submit").
stages:
  - pre-build
  - build
  - test
  - memory-leak
  - pages

# When pipelines run -- exactly one pipeline per commit: an MR pipeline when
# the branch has an open MR, otherwise a branch pipeline. GitLab CE 17.8.7:
# merge_request_event pipelines are detached pipelines on the MR head, which
# the "Pipelines must succeed" setting accepts as the merge gate. Rule order
# matters (first match wins):
#   1. merge_request_event -- MR created/reopened/retargeted or new commits on
#      its source branch: the full suite on the MR head SHA (the merge gate).
#   2. web / api / trigger -- manually started (e.g. the release flow with
#      IS_RELEASE=true to skip the history gitleaks scan); always allowed,
#      regardless of MR state, so it is listed before the dedup rule below.
#   3. branch push WITH an open MR -- skip: rule 1 already validates this exact
#      commit on the MR head, so a branch pipeline would only duplicate it.
#   4. branch push WITHOUT an open MR (master/main or a feature branch) -- run
#      a branch pipeline (master/main also carries the pages job).
#   5. anything else (e.g. tag pushes) -- no pipeline; run one manually if a
#      tag needs its own CI (a second full codescan runs up to 2h).
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - when: never

# Every runner serving this repo is tagged, and a tagged runner ignores
# untagged jobs by default -- without a tag here all jobs pile onto whichever
# single runner has "Run untagged jobs" enabled, serializing the pipeline no
# matter what the needs DAG allows. amd64 is the generic tag both shared
# build runners carry; change it here in one place if the org convention
# differs.
default:
  tags: [amd64]

variables:
  GIT_SUBMODULE_STRATEGY: none
  CMAKE_BUILD_DIR: build
  ASAN_BUILD_DIR: build-asan
  EXAMPLES_BUILD_DIR: build-examples
  # Python deps for the venv, split by consumer so build-side jobs depend
  # only on the codegen stack, never on the test-runtime crypto stack
  # (which the internal build image's package index may not serve):
  #   PIP_BUILD_DEPS  jsonschema, jinja2         -> mbedtls build-time PSA codegen
  #   PIP_MOCK_DEPS   pycryptodome, cryptography -> iot-client test mock servers
  PIP_BUILD_DEPS: "jsonschema jinja2"
  PIP_MOCK_DEPS: "pycryptodome cryptography"
  # The build image's pip pulls from the public PyPI (files.pythonhosted.org
  # in the traceback), and that link flakes: 2026-11-10 run died on a read
  # timeout mid-download at pip's 15 s default. The earlier "pycryptodome
  # (from versions: none)" was the same flaky link failing at the index-fetch
  # phase (the retry WARNINGs are hidden by -q) -- not a missing package and
  # not the Python version (image is 3.12). 60 s read timeout absorbs the
  # slow-but-alive path; the root fix is a reachable index (group-level
  # PIP_INDEX_URL variable, or a pip.conf baked into the build image).
  PIP_DEFAULT_TIMEOUT: "60"
  # Reuse pip's download cache across jobs/pipelines. The dir must sit under
  # $CI_PROJECT_DIR for GitLab to cache it; pip reads PIP_CACHE_DIR. Only the
  # download cache is reused -- the venv is recreated per job (it bakes an
  # absolute path, unsafe to cache). GitLab cache is per-runner unless a
  # distributed cache (S3/MinIO) is configured at the runner level; the real
  # fix for the flaky public-PyPI link is still a reachable internal index
  # (group PIP_INDEX_URL / a pip.conf in the build image).
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Shared job prep (hidden dot-prefixed jobs are never scheduled; jobs alias
# their steps in). &venv_steps creates the venv at the path the build job
# baked into the test binaries (Python3_EXECUTABLE -- mbedtls codegen and the
# mock servers both run from it); &deps_steps additionally syncs the
# submodules the configure+build jobs need. The venv lines are spelled out
# again in &deps_steps instead of aliased, so no job ends up with a
# doubly-nested before_script sequence -- GitLab flattening one nesting level
# is the documented pattern; deeper nesting is not worth betting the pipeline
# on. Plain YAML anchors rather than !reference so any YAML parser can
# validate the file offline.
#
# The pip installs run as a 3-attempt retry loop: the runner pool's egress
# to the public PyPI (files.pythonhosted.org) flakes mid-download -- read
# timeouts measured on two different runners on 2026-11-10 -- and pip's
# own --retries does not cover a read timeout mid-stream. Files that
# finished downloading stay in pip's HTTP cache inside the same container,
# so each attempt re-fetches only what died.
# Pip download cache (see PIP_CACHE_DIR above), aliased into the jobs that run
# pip. The venv itself is never cached.
.pip_cache:
  cache: &pip_cache
    key: pip-cache
    paths:
      - .cache/pip

.venv:
  before_script: &venv_steps
    - python3 -m venv venv
    - . venv/bin/activate
    # break (not exit) on success: jobs that append steps after this anchor
    # (examples' apt line, test:sanitizers' mock-deps install) must still run.
    - |
      ok=0
      for i in 1 2 3; do
        pip install -q ${PIP_BUILD_DEPS} ${PIP_MOCK_DEPS} && { ok=1; break; }
        echo "pip install attempt ${i}/3 failed; retrying in 15s" >&2
        sleep 15
      done
      [ "$ok" = 1 ] || exit 1

.deps:
  before_script: &deps_steps
    - git submodule sync --recursive
    - git submodule update --init --recursive
    - python3 -m venv venv
    - . venv/bin/activate
    - |
      ok=0
      for i in 1 2 3; do
        pip install -q ${PIP_BUILD_DEPS} && { ok=1; break; }
        echo "pip install attempt ${i}/3 failed; retrying in 15s" >&2
        sleep 15
      done
      [ "$ok" = 1 ] || exit 1

build:
  stage: build
  image: ${BUILD_IMAGE}
  # Mirror GitHub's concurrency.cancel-in-progress: a newer push cancels this
  # job (requires the project setting "Auto-cancel redundant pipelines").
  interruptible: true
  cache: *pip_cache
  before_script: *deps_steps
  script:
    - cmake --version
    - cmake -B ${CMAKE_BUILD_DIR} -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPython3_EXECUTABLE=$(which python3)
    - cmake --build ${CMAKE_BUILD_DIR} -j$(nproc)
  artifacts:
    paths:
      - ${CMAKE_BUILD_DIR}/
    expire_in: 1 hour

test:
  stage: test
  image: ${BUILD_IMAGE}
  interruptible: true
  needs:
    - build
  cache: *pip_cache
  # Recreate the venv at the same path the build job baked into the test
  # binaries (Python3_EXECUTABLE), with the mock dependencies installed.
  before_script: *venv_steps
  script:
    # Static guard: SDK code must log through the facade (common/log.h
    # log_tag_*), never call log_emit/printf directly -- a raw call site
    # bypasses the compile-time ceiling and reappears in every build.
    # Allowed: the facade + its sink (common/log.{h,c}) and test harnesses;
    # examples and third_party are out of scope. The word boundary is
    # hand-rolled as (^|[^A-Za-z0-9_]) so fprintf/snprintf-style libc calls
    # are not flagged and the CI image's git needs no PCRE.
    - |
      LEAKS=$(git grep -nE '(^|[^A-Za-z0-9_])(log_emit|printf)[ ]*\(' -- modules common pal \
                ':!common/log.h' ':!common/log.c' ':(exclude,glob)**/test/**' || true)
      if [ -n "$LEAKS" ]; then
        echo "Raw log_emit/printf call sites outside the log facade:"
        echo "$LEAKS"
        echo "Route them through the log_tag_* macros in common/log.h instead."
        exit 1
      fi
    # Reproduce the pinned upstream-header checks; the host CTest matrix below
    # separately exercises PAL behavior against test shims.
    - cmake --build ${CMAKE_BUILD_DIR} --target check_freertos_pal
    # Serial ctest with the empty-list count guard lives in tools/ci_ctest.sh
    # (the CI image's ctest does not honour --test-dir and may predate
    # --no-tests=error; the script header documents both).
    - tools/ci_ctest.sh ${CMAKE_BUILD_DIR} 180 "the CTestTestfile list was not regenerated (see the enable_testing() note in CMakeLists.txt)"

# CodeScan security scan (tools/codescan_ci.py): trigger -> poll -> blocking
# decision against the CodeScan CI API. The CI side never uploads source --
# the backend clones the repo itself -- so the job needs no build artifacts:
# it rides in the parallel build wave (needs: []) instead of gating on
# build/test.
#
# Required project/group CI/CD variables:
#   CODESCAN_API_BASE  platform base URL, e.g. https://codescan.example.com
#   CODESCAN_TOKEN     API token, Masked. Do NOT mark it Protected: the feat/*
#                      branches here are unprotected, and a Protected token
#                      would strip the security gate from exactly the branches
#                      that carry the changes being reviewed.
# Optional per-pipeline variables (see the script header for the full list):
#   SCAN_TYPE          quick / codeql / agent; unset = platform default
#   BLOCK_SEVERITIES   blocking set; unset = platform block_severities, so the
#                      platform can retune every repo from one place
#   BLOCK_ON_VULN      false = report-only (still exits non-zero on scan errors)
#   SCAN_TIMEOUT_SEC   default 3600; agent scans need >= 7200 AND a raised job
#                      timeout below (keep the job timeout above this value)
codescan:
  stage: build
  image: python:3.12-alpine
  interruptible: true
  needs: []
  # Scan errors, timeouts AND blocking-severity findings all exit non-zero;
  # the job must fail the pipeline (and so the MR merge check) -- never let a
  # later edit soften this to allow_failure.
  allow_failure: false
  timeout: 2h
  script:
    - python3 tools/codescan_ci.py
  artifacts:
    when: always
    paths:
      - codescan-report.json
    expire_in: 1 week

# Secret detection (gitleaks) on the official Docker Hub image. This
# deliberately does NOT use the GitLab-managed Security/Secret-Detection
# template: its analyzer image lives on registry.gitlab.com, which these
# runners cannot reach (connection reset, measured 2026-11-10; Docker Hub
# is fine -- the codescan and pages jobs already pull from it), and its
# analyzer REPORTS-AND-SUCCEEDS: findings go into the report artifact while
# the job stays green, so allow_failure: false there gates only operational
# failures, not findings. Running gitleaks directly makes a finding fail
# the job (allow_failure: false -- never soften this to let a leaked key
# through). gitleaks scans the git history reachable from the built ref
# (git mode, every commit diff; --log-opts=HEAD is REQUIRED: by default
# gitleaks scans every ref in the clone, and a runner clone carries all
# branches on the server -- without it a colleague's unmerged branch
# fixture would fail this pipeline), so GIT_DEPTH: 0 below fetches the
# complete history -- the default depth of 20 would silently scan only
# the last 20 commits. The global GIT_SUBMODULE_STRATEGY: none plus
# GIT_STRATEGY: clone keep the third_party submodules empty: runner
# workspaces persist between jobs on the same slot and `git clean` does
# not remove gitlink paths, so third_party/ left populated by build
# jobs' submodule init leaked into the first real run (35 MB scanned,
# 905 upstream-test findings; the gate's scope is this repo's own
# content). --redact keeps any found secret out of the job log;
# findings land in gitleaks-report.json. Deliberately-committed
# fixtures -- current-tree ones and history-only values from deleted
# modules -- are reviewed exceptions in .gitleaks.toml, exact values
# where possible, so a NEW secret next to an allowed one still fails
# (verified with an injected canary key); the config also scopes out
# third_party/. Skipped only when a release pipeline sets
# IS_RELEASE=true. Keep the version pin: `latest` would silently change
# the ruleset under a green pipeline.
secret_detection:
  stage: pre-build
  image:
    name: zricethezav/gitleaks:v8.30.1
    # The image's ENTRYPOINT is `gitleaks`; reset it so script gets a shell.
    entrypoint: [""]
  cache: {}
  # Fresh clone every run -- see the comment above for why the reused
  # workspace cannot be trusted to hold only this repo's content. Full
  # depth: the git-mode scan must see every commit, not the latest 20.
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
  allow_failure: false
  interruptible: true
  rules:
    - if: '$IS_RELEASE != "true"'
  script:
    - gitleaks version
    - gitleaks git . --redact --no-banner --exit-code 1 --config .gitleaks.toml --log-opts="HEAD" --report-format json --report-path gitleaks-report.json
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 1 week

# Mirrors .github/workflows/ci.yml `sanitizers`: a separate Debug tree with
# ASan + UBSan, not the RelWithDebInfo artifacts. Leak detection stays off
# (third-party libs/mocks); memory errors and UB abort the run.
test:sanitizers:
  stage: build
  image: ${BUILD_IMAGE}
  interruptible: true
  # Own configure+build inside the parallel wave: needs: [] -- no waiting on
  # the `build` job and no download of its artifacts.
  needs: []
  cache: *pip_cache
  # &deps_steps carries the codegen stack; this job also RUNS the
  # mock-driven suites against its own tree, so the mock-server crypto
  # stack goes on top (one nesting level, like the examples job's apt line).
  before_script:
    - *deps_steps
    - |
      ok=0
      for i in 1 2 3; do
        venv/bin/pip install -q ${PIP_MOCK_DEPS} && { ok=1; break; }
        echo "pip install attempt ${i}/3 failed; retrying in 15s" >&2
        sleep 15
      done
      [ "$ok" = 1 ] || exit 1
  script:
    - cmake -S . -B ${ASAN_BUILD_DIR} -DCMAKE_BUILD_TYPE=Debug -DPython3_EXECUTABLE=$(which python3) -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g -O1" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
    - cmake --build ${ASAN_BUILD_DIR} -j$(nproc)
    - ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 tools/ci_ctest.sh ${ASAN_BUILD_DIR} 240 "the sanitizer tree's CTestTestfile list was not regenerated"

# Mirrors .github/workflows/ci.yml `examples`: configure and build the POSIX
# examples as a separate top-level project. Rides in the parallel wave
# (needs: []).
examples:
  stage: build
  image: ${BUILD_IMAGE}
  interruptible: true
  needs: []
  cache: *pip_cache
  before_script:
    - *deps_steps
    # libopus enables the optional audio_chat_demo; without it that one
    # demo removes itself on a message(STATUS) and the rest still build.
    # Best-effort: not every runner image allows apt-get.
    - |
      (apt-get update -qq && apt-get install -y -qq libopus-dev) \
        || echo "libopus unavailable: audio_chat_demo will be skipped"
  script:
    # examples/posix fetches qrcodegen / quirc / stb via FetchContent at
    # configure time, and links the prebuilt rtc-client lib.
    - cmake -S examples/posix -B ${EXAMPLES_BUILD_DIR} -DPython3_EXECUTABLE=$(which python3)
    - cmake --build ${EXAMPLES_BUILD_DIR} -j$(nproc)
    # AGENTS.md: demos whose prerequisite is missing remove themselves on a
    # plain message(STATUS), so a green build can quietly produce fewer
    # targets -- assert the full expected set for this platform instead.
    # Every target in examples/posix/CMakeLists.txt must appear, including
    # the udp_* pair (modules/rtc-client/libs/linux-gnu-amd64/libstm.a is
    # in-tree, so tuya_steam_client exists on the amd64 runners). Only
    # audio_chat_demo is legitimately optional: it depends on the best-effort
    # libopus install above, so require it only when opus is present.
    - |
      MISSING=""
      for t in activate_demo scan_by_app_pair_demo scan_by_device_pair_demo \
               unbind_demo dp_management_demo ota_demo ota_confirm_demo \
               ai/role-management/role_management_demo \
               udp_chat_demo udp_edu_camera_demo \
               text_chat_demo workflow_variables_demo edu_camera_demo \
               music_play_demo mcp_demo agent_trigger_demo mqtt_interrupt_demo; do
        [ -x "${EXAMPLES_BUILD_DIR}/${t}" ] || MISSING="${MISSING} ${t}"
      done
      if pkg-config --exists opus 2>/dev/null || ldconfig -p 2>/dev/null | grep -q libopus; then
        [ -x "${EXAMPLES_BUILD_DIR}/audio_chat_demo" ] || MISSING="${MISSING} audio_chat_demo"
      else
        echo "libopus not present on this runner: audio_chat_demo may be absent (accepted)"
      fi
      if [ -n "$MISSING" ]; then
        echo "examples job: demo targets missing from the build:${MISSING}"
        exit 1
      fi
      echo "examples job: all expected demo targets present"

test:memory-leak:
  stage: memory-leak
  image: ${BUILD_IMAGE}
  interruptible: true
  needs:
    - build
    - test
  script:
    - |
      set +e
      FAILED=0
      VG=modules/iot-client/test/run_valgrind_check.sh
      chmod +x "$VG"
      # Leak-check the pure (no-subprocess) binaries, grouped by module:
      #   pal            : pal_freertos_time_*_test, pal_posix_time_test
      #   rtc-tcp-client : tai_unit_tests, tai_log_level_zero_tests,
      #                    tai_log_module_zero_tests, tai_integration_tests,
      #                    workflow_variables_demo_test
      #   iot-client     : iot_cipher_test, iot_ai_ctrl_test
      #   tuya-ble       : tuya_ble_test
      #   biz-client     : biz_ai_role_test (public ATOP boundary faked)
      # rtc-client is a prebuilt closed lib (headers + libstm.a) with no offline
      # test, so there is nothing to leak-check for it here. The mock-driven iot
      # tests are covered by the `test` job; under valgrind their Python
      # handshakes would time out.
      for t in pal_freertos_time_16_1000_test pal_freertos_time_32_1000_test pal_freertos_time_32_100_test pal_freertos_time_32_128_test pal_freertos_time_32_2000_test pal_freertos_time_64_1000_test pal_posix_time_test biz_ai_role_test tai_unit_tests tai_log_level_zero_tests tai_log_module_zero_tests tai_integration_tests workflow_variables_demo_test iot_cipher_test iot_ai_ctrl_test tuya_ble_test; do
        echo "==================== valgrind: ${t} ===================="
        "$VG" "./${CMAKE_BUILD_DIR}/${t}" 2>&1 | tee "valgrind-${t}.log"
        rc=${PIPESTATUS[0]}
        if [ "$rc" -ne 0 ]; then
          echo "x ${t}: leak/valgrind failure (rc=${rc})"
          FAILED=1
        else
          echo "ok ${t}: clean"
        fi
      done
      exit $FAILED
  artifacts:
    when: on_failure
    paths:
      - valgrind-*.log
    expire_in: 1 week
  allow_failure: false

pages:
  stage: pages
  image: node:22-alpine
  interruptible: true
  # Docs deploy is independent of the C build/test — run it without waiting.
  needs: []
  script:
    - cd docs-site
    - npm ci
    - npm run build
    - mv build ../public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
